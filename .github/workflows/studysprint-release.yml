name: StudySprint Android Release

on:
  push:
    branches: [main]
    paths:
      - 'daily_apps/studysprint/**'
      - '.github/workflows/studysprint-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily_apps/studysprint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # A debug APK is intentionally used for this direct-install release.
      # Android signs debug builds automatically, so the downloaded APK is
      # installable without requiring a private signing key in the repository.
      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Locate and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            echo "No APK was produced under app/build/outputs/apk"
            find app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi
          echo "Using APK: ${APK_PATH}"
          cp "${APK_PATH}" studysprint-v0.1.1.apk
          ls -lh studysprint-v0.1.1.apk

      - name: Verify APK is a valid ZIP/APK container
        run: unzip -t studysprint-v0.1.1.apk >/dev/null

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studysprint-v0.1.1
          name: StudySprint v0.1.1
          body: |
            StudySprint Day 02 direct-install build.

            This release uses the Android-signed debug variant so it can be
            installed directly from the Daily Innovation website without a
            private release keystore.
          files: daily_apps/studysprint/studysprint-v0.1.1.apk
          make_latest: false
