name: StudySprint Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'studysprint/**'
      - '.github/workflows/studysprint-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.2'
          cache: true
      - name: Create Android project
        shell: bash
        run: |
          flutter create --org com.gokul --project-name studysprint build/studysprint_flutter
          cp studysprint/pubspec.yaml build/studysprint_flutter/pubspec.yaml
          cp studysprint/lib/main.dart build/studysprint_flutter/lib/main.dart
          mkdir -p build/studysprint_flutter/android/app/src/main/res/drawable
          cat > build/studysprint_flutter/android/app/src/main/res/drawable/ic_studysprint.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#5B4BDB" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M29,27h50c4,0 7,3 7,7v40c0,4 -3,7 -7,7h-50c-4,0 -7,-3 -7,-7v-40c0,-4 3,-7 7,-7z"/>
            <path android:fillColor="#5B4BDB" android:pathData="M35,39h38v5h-38zM35,51h25v5h-25zM35,63h31v5h-31z"/>
            <path android:fillColor="#7C3AED" android:pathData="M69,53l4,4 9,-10 4,4 -13,14 -8,-8z"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/studysprint_flutter/android/app/src/main/AndroidManifest.xml')
          s=p.read_text().replace('android:label="studysprint"','android:label="StudySprint"').replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/ic_studysprint"')
          p.write_text(s)
          PY
      - name: Build
        working-directory: build/studysprint_flutter
        run: |
          flutter pub get
          flutter analyze lib/main.dart
          flutter build apk --release --no-shrink
      - name: Validate APK
        run: |
          test -s build/studysprint_flutter/build/app/outputs/flutter-apk/app-release.apk
          unzip -t build/studysprint_flutter/build/app/outputs/flutter-apk/app-release.apk >/dev/null
          mkdir -p release
          cp build/studysprint_flutter/build/app/outputs/flutter-apk/app-release.apk release/StudySprint-v1.0.0.apk
          sha256sum release/StudySprint-v1.0.0.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete studysprint-v1.0.0 --yes || true
          gh release create studysprint-v1.0.0 release/StudySprint-v1.0.0.apk --title 'StudySprint v1.0.0' --notes 'Day 02 Daily App: offline study task planner and 25-minute focus timer.'
