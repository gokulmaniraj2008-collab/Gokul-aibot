name: StudySprint Android Release

on:
  push:
    branches: [main]
    paths:
      - 'daily_apps/studysprint/**'
      - '.github/workflows/studysprint-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daily_apps/studysprint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Locate and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            echo "No APK was produced under app/build/outputs"
            find app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "Using APK: ${APK_PATH}"
          cp "${APK_PATH}" studysprint-v0.1.0.apk
          ls -lh studysprint-v0.1.0.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studysprint-v0.1.0
          name: StudySprint v0.1.0
          body: |
            StudySprint Day 02 test Android build.

            Lightweight study planner test app with a 25-minute focus sprint interaction.
          files: daily_apps/studysprint/studysprint-v0.1.0.apk
          make_latest: false
