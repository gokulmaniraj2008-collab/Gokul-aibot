name: FieldNote Android Release

on:
  push:
    branches: [main]
    paths:
      - 'fieldnote/**'
      - '.github/workflows/fieldnote-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldnote
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Create GitHub release and upload APK
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fieldnote-v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create fieldnote-v1.0.0 \
            fieldnote/build/app/outputs/flutter-apk/app-release.apk#FieldNote-v1.0.0.apk \
            --title 'FieldNote v1.0.0' \
            --notes 'FieldNote v1.0.0 — first released Android build. Offline field observations, crop/field tagging, search, and local persistence.'
