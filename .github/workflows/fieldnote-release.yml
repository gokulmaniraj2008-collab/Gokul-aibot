name: FieldNote Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'fieldnote/**'
      - '.github/workflows/fieldnote-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project from FieldNote source
        run: |
          rm -rf build/fieldnote_flutter
          flutter create --platforms=android --org com.gokulai --project-name fieldnote build/fieldnote_flutter
          cp fieldnote/pubspec.yaml build/fieldnote_flutter/pubspec.yaml
          cp -R fieldnote/lib build/fieldnote_flutter/lib
          cd build/fieldnote_flutter
          flutter pub get

      - name: Analyze FieldNote source
        working-directory: build/fieldnote_flutter
        run: flutter analyze lib/main.dart

      - name: Build release APK
        working-directory: build/fieldnote_flutter
        run: flutter build apk --release --no-shrink

      - name: Validate APK
        run: |
          APK="build/fieldnote_flutter/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/FieldNote-v1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldNote-Android-${{ github.run_number }}
          path: release/FieldNote-v1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fieldnote-v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create fieldnote-v1.0.0 release/FieldNote-v1.0.0.apk#FieldNote-v1.0.0.apk --repo "$GITHUB_REPOSITORY" --title "FieldNote v1.0.0" --generate-notes
