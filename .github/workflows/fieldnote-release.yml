name: FieldNote Android Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'fieldnote/**'
      - '.github/workflows/fieldnote-release.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project from FieldNote source
        run: |
          rm -rf build/fieldnote_flutter
          flutter create --platforms=android --org com.gokulai --project-name fieldnote build/fieldnote_flutter
          cp fieldnote/pubspec.yaml build/fieldnote_flutter/pubspec.yaml
          cp -R fieldnote/lib build/fieldnote_flutter/lib
          mkdir -p build/fieldnote_flutter/android/app/src/main/res/drawable
          cat > build/fieldnote_flutter/android/app/src/main/res/drawable/ic_fieldnote.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#315B3C" android:pathData="M8,8 L100,8 L100,100 L8,100 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M54,23 C38,31 29,43 31,56 C33,69 43,76 54,80 C65,76 75,69 77,56 C79,43 70,31 54,23 Z" />
              <path android:fillColor="#6D956F" android:pathData="M54,31 L54,76 L58,76 L58,31 Z" />
              <path android:fillColor="#315B3C" android:pathData="M35,58 L50,50 L50,55 L35,63 Z M58,48 L73,40 L73,45 L58,53 Z" />
              <path android:fillColor="#FFFFFF" android:pathData="M25,86 L83,86 L83,91 L25,91 Z" />
          </vector>
          EOF
          sed -i 's/android:label="fieldnote"/android:label="FieldNote"/' build/fieldnote_flutter/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/ic_fieldnote"/' build/fieldnote_flutter/android/app/src/main/AndroidManifest.xml
          cd build/fieldnote_flutter
          flutter pub get

      - name: Analyze FieldNote source
        working-directory: build/fieldnote_flutter
        run: flutter analyze lib/main.dart

      - name: Build release APK
        working-directory: build/fieldnote_flutter
        run: flutter build apk --release --no-shrink

      - name: Validate APK
        run: |
          APK="build/fieldnote_flutter/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p release
          cp "$APK" release/FieldNote-v1.0.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldNote-Android-${{ github.run_number }}
          path: release/FieldNote-v1.0.2.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fieldnote-v1.0.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create fieldnote-v1.0.2 release/FieldNote-v1.0.2.apk#FieldNote-v1.0.2.apk --repo "$GITHUB_REPOSITORY" --title "FieldNote v1.0.2" --generate-notes
